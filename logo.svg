<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Dark Glassmorphism Background -->
  <rect width="512" height="512" rx="128" fill="#15151e"/>
  
  <!-- Subtle Dashboard Tachometer Track -->
  <path d="M 120 390 A 200 200 0 1 1 392 390" fill="none" stroke="#2a2a35" stroke-width="40" stroke-linecap="round"/>
  
  <!-- F1 Red RPM Sweep -->
  <path d="M 120 390 A 200 200 0 0 1 420 150" fill="none" stroke="#e10600" stroke-width="40" stroke-linecap="round"/>
  
  <!-- Digital Dashboard Text -->
  <text x="256" y="290" font-family="Arial, sans-serif" font-size="120" font-weight="900" font-style="italic" fill="#ffffff" text-anchor="middle" letter-spacing="-5">PIT</text>
  
  <!-- Sleek Racing Line Underneath -->
  <path d="M 180 330 L 300 330 L 330 300" fill="none" stroke="#e10600" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
